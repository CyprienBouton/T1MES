[project]
name = "T1MES"
version = "0.1.0"
description = "Create a T1MES Phantom for MRzero"
authors = [
    {name = "Cyprien Bouton cyprien.bouton@creatis.insa-lyon.fr"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[tool.poetry.dependencies]
python = "^3.10" 
mrzerocore = "0.4.11"
mrtwin = "0.1.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools]
packages = ["t1mes"]

[project.scripts]
t1mes_build_static = "t1mes.build_static_phantom:main"